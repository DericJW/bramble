<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Bramble</title>
    <meta name="description" content="A cosy pixel ledger for your money, miles, spending and what you owe." />

    <!-- Install to the home screen (iPhone: Safari → Share → Add to Home Screen). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7A4A2A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bramble" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts from the design: Zen Maru Gothic for text, Pixelify Sans for titles. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background-color: #cdbb98;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      svg {
        shape-rendering: crispEdges;
      }
      /* The pixel frames show which box is active; no browser focus ring on top. */
      input,
      textarea {
        outline: none;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Bramble.</noscript>
    <div id="root"></div>
  </body>
</html>
